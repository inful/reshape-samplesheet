name: reshape_samplesheet
description: |
  Read an Illumina samplesheet (bcl2fastq or Local Run Manager format),
  match Sample_IDs against fastq files in a directory, and emit a CSV
  in the generic nf-core layout (sample,fastq_1,fastq_2[,strandedness]).

  Multiple R1/R2 files per sample (e.g. across lanes) are RFC-4180
  quoted and comma-joined into a single cell. Single-end samples get
  an empty fastq_2 cell. Strict error contract: every malformed input
  throws IllegalArgumentException with the file path and all detected
  problems in one error message — no silent partial output.

  Emits two views of the same data: a `csv` channel (the canonical
  artifact) and a `samples` channel (structured tuples ready to be
  re-tupled into a `(meta, reads)` pair by the consumer). The
  samples emit means a downstream consumer needs only three lines
  to feed the data into an nf-core analysis module (see
  examples/poc/ for a fastqc-based POC).
keywords:
  - samplesheet
  - illumina
  - bcl2fastq
  - local-run-manager
  - nf-core
  - reshape
  - subworkflow
components:
  - samplesheet_validate
  - samplesheet_reshape
input:
  - ch_samplesheet:
      type: file
      description: |
        The Illumina samplesheet CSV (bcl2fastq or Local Run Manager format).
        Structure: [ path(samplesheet.csv) ]
      pattern: "*.csv"
  - ch_fastq_dir:
      type: directory
      description: |
        Directory containing the fastq(.gz) files. Filenames are matched
        against the Sample_IDs in the samplesheet.
        Structure: [ path(fastq_dir) ]
  - ch_output_dir:
      type: directory
      description: |
        Directory to write the reshaped CSV into. Created if it does not
        already exist. The output filename is `<samplesheet_basename>.nfcore.csv`.
        Structure: [ path(output_dir) ]
  - ch_opts:
      type: map
      description: |
        Options map. Recognised keys (all optional, all forward-compatible):
        - recursive (Boolean, default false): walk fastq_dir recursively.
        - strandedness (String, default null): when non-null, add a 4th column.
        - pattern (String, default null): custom regex template for filename matching.
        - validateStructure (Boolean, default false): run bcl2fastq structural checks.
output:
  - csv:
      type: file
      description: |
        The reshaped CSV in nf-core layout. One row per Sample_ID,
        columns: sample,fastq_1,fastq_2[,strandedness]. Multiple lanes
        are RFC-4180 quoted and comma-joined into a single cell.
        Structure: [ path(*.nfcore.csv) ]
      pattern: "*.nfcore.csv"
  - samples:
      type: tuple
      description: |
        Structured per-sample records, built by parsing the csv emit
        through the lib's canonical ReshapedCsvParser. Each tuple is
        [ meta, fastq_1, fastq_2 ] where:
        - meta: [id: 'sample_id', single_end: true|false]
        - fastq_1: [File, ...]  (R1 fastq paths, possibly multiple lanes)
        - fastq_2: [File, ...]  (R2 fastq paths; empty for single-end)

        This is the canonical hand-off shape for downstream nf-core
        modules. A typical consumer is three lines:
          RESHAPE_SAMPLESHEET.out.samples
              .map { meta, fq1, fq2 -> [meta, fq1 + fq2] }
              .set { ch_input }
          FASTQC(ch_input)   // or any (meta, reads) consumer

        Structure: [ [meta: map, fastq_1: [path], fastq_2: [path]] ]
  - versions:
      type: file
      description: |
        File containing tool versions from both modules.
        Structure: [ path(versions.yml) ]
      pattern: "versions.yml"
authors:
  - "@inful"
maintainers:
  - "@inful"