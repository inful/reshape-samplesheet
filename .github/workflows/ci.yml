# GitHub Actions CI for reshape-samplesheet.
#
# Three jobs:
#   1. lint-manifest  — verifies the manifest fields stay sensible (name,
#                       version, author, nextflowVersion, mainScript).
#                       Cheap, runs first.
#   2. lint-nf-core   — runs `nf-core subworkflows lint` to validate the
#                       nf-core layout (meta.yml, ≥2 modules, tags,
#                       versions channel, etc.).
#   3. test           — runs `bin/test.sh --nf-test` (the nf-test suite
#                       for the sub-workflow) AND `bin/test.sh --smoke`
#                       (Nextflow end-to-end), on a matrix of Nextflow
#                       versions. Pin specific patch versions below to
#                       keep builds reproducible; bump periodically.
#
# To add a new Nextflow line (e.g. 27.x when ready), add another entry to
# matrix.nextflow under the `test` job.

name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs when a new commit lands on the same branch/PR.
# Saves CI minutes on rapid pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default GITHUB_TOKEN to read-only. We don't write back to the repo.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # lint-manifest: cheap manifest sanity checks. No Nextflow version pinned —
  # always uses the latest stable for the lint job since we're just verifying
  # the nextflow.config fields stay sane.
  # ---------------------------------------------------------------------------
  lint-manifest:
    name: Lint manifest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Nextflow (latest stable)
        run: |
          set -euo pipefail
          curl -s https://get.nextflow.io | bash
          chmod +x nextflow
          sudo mv nextflow /usr/local/bin/nextflow
          nextflow -version

      - name: Verify manifest fields
        run: |
          set -euo pipefail
          # `nextflow config <key>` in 25+ sometimes treats the key as a remote
          # repo path (e.g. tries to fetch manifest.name from nextflow-io/manifest.name).
          # Grep the nextflow.config directly — it's simpler and version-agnostic.
          NAME=$(awk -F"'" '/^[[:space:]]*name[[:space:]]*=/{print $2; exit}' nextflow.config)
          VERSION=$(awk -F"'" '/^[[:space:]]*version[[:space:]]*=/{print $2; exit}' nextflow.config)
          AUTHOR=$(awk -F"'" '/^[[:space:]]*author[[:space:]]*=/{print $2; exit}' nextflow.config)
          MIN_NF=$(awk -F"'" '/^[[:space:]]*nextflowVersion[[:space:]]*=/{print $2; exit}' nextflow.config)
          MAIN=$(awk -F"'" '/^[[:space:]]*mainScript[[:space:]]*=/{print $2; exit}' nextflow.config)
          test "$NAME" = "reshape-samplesheet" \
            || { echo "::error::manifest.name should be 'reshape-samplesheet', got: $NAME"; exit 1; }
          test "$MAIN" = "main.nf" \
            || { echo "::error::manifest.mainScript should be 'main.nf', got: $MAIN"; exit 1; }
          # nextflowVersion must reference 22.10+ (the DSL2 minimum we support)
          echo "$MIN_NF" | grep -q '22\.10' \
            || { echo "::error::manifest.nextflowVersion should reference 22.10+, got: $MIN_NF"; exit 1; }
          echo "::group::Manifest values"
          echo "  name              = $NAME"
          echo "  version           = $VERSION"
          echo "  author            = $AUTHOR"
          echo "  nextflowVersion   = $MIN_NF"
          echo "  mainScript        = $MAIN"
          echo "::endgroup::"

  # ---------------------------------------------------------------------------
  # lint-nf-core: validates the nf-core layout (meta.yml, ≥2 modules,
  # test files, versions channel, schema compliance, etc.).
  # ---------------------------------------------------------------------------
  lint-nf-core:
    name: Lint nf-core layout
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install nf-core tools
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # nf-core (Python) for `nf-core subworkflows lint`
          python -m pip install --upgrade nf-core

      - name: Run nf-core subworkflows lint
        run: nf-core subworkflows lint reshape_samplesheet --dir  --fail-on-warn

  # ---------------------------------------------------------------------------
  # test: nf-test suite + Nextflow smoke test, on a matrix of Nextflow
  # patch versions. fail-fast: false so a failure on one version still
  # surfaces the result on the others (useful when one line regresses).
  # ---------------------------------------------------------------------------
  test:
    name: Tests (Nextflow ${{ matrix.nextflow }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        nextflow:
          - '25.10.4'   # latest 25.x patch line
          - '26.04.4'   # primary development target (per nextflow.config)

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Groovy is needed for `bin/test.sh --full`. Install a known-good
      # Groovy 4.x binary directly (SDKMAN's installer has compatibility
      # issues with `set -u` in its helper scripts).
      - name: Install Groovy (for unit tests)
        env:
          GROOVY_VERSION: '4.0.33'
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends unzip ca-certificates
          # Use dlcdn.apache.org (current downloads mirror) instead of
          # archive.apache.org (slower historical mirror). Layout:
          #   /groovy/<version>/distribution/apache-groovy-binary-<version>.zip
          curl -fsSL \
            "https://dlcdn.apache.org/groovy/${GROOVY_VERSION}/distribution/apache-groovy-binary-${GROOVY_VERSION}.zip" \
            -o /tmp/groovy.zip
          sudo unzip -q /tmp/groovy.zip -d /opt/
          sudo ln -sf "/opt/groovy-${GROOVY_VERSION}/bin/groovy" /usr/local/bin/groovy
          sudo ln -sf "/opt/groovy-${GROOVY_VERSION}/bin/groovyc" /usr/local/bin/groovyc
          groovy --version

      # NXF_VER is the canonical way to pin Nextflow without forking the
      # install script. The get.nextflow.io script honours it on first run.
      - name: Install Nextflow ${{ matrix.nextflow }}
        env:
          NXF_VER: ${{ matrix.nextflow }}
        run: |
          set -euo pipefail
          curl -s https://get.nextflow.io | bash
          chmod +x nextflow
          sudo mv nextflow /usr/local/bin/nextflow
          nextflow -version

      - name: Run nf-test suite (replaces the old bespoke Groovy tests)
        run: bin/test.sh --nf-test

      - name: Run Nextflow smoke test
        run: bin/test.sh --smoke